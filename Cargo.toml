# Cargo.toml

[package]
name = "fmi_get_temp"
version = "1.5.0"
authors = ["Sami J. Mäkinen <sjm@iki.fi>"]
description = "FMI get temperature reading"
repository = "https://github.com/sjm42/fmi-get-temp"
readme = "README.md"
keywords = ["fmi", "temperature"]
license = "MIT OR Apache-2.0"
edition = "2024"
resolver = "2"


[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
coap = { version = "0.26", default-features = false }
chrono = "0.4"
reqwest = { version = "0.13", default-features = false, features = [
    "brotli",
    "charset",
    "deflate",
    "gzip",
    "http2",
    "json",
    "rustls",
    "hickory-dns",
] }
roxmltree = "0.21"
rumqttc = "0.25"
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.28", features = ["v4"] }

[dev-dependencies]
flate2 = "1.1"
rcgen = "0.14"
tokio-rustls = "0.26"


[build-dependencies]
anyhow = "1.0"
build-data = "0.3"


[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"


[profile.minsize]
inherits = "release"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

# EOF
